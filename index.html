      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/level-white.svg" />
    <style>
      /* Shown until the app script takes over; mirrors .boot-screen in styles.css. */
      html {
        background: #131517;
      }
      .boot-screen {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 22px;
        background: #131517;
        color: #9f9f9f;
        font:
          14px Inter,
          Arial,
          sans-serif;
      }
      .boot-ring {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: #ededed;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="root">
      <div class="boot-screen">
        <img src="/level-white.svg" alt="Level" width="150" height="42" />
        <div class="boot-ring"></div>
        <span>Loading your studio…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
