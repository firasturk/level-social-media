<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Level Social Media</title>
    <meta
      name="description"
      content="Social-media post studio for Level MENA clients: brand kits, themes, product and script posts, feed grids."
    />
    <link rel="preload" as="image" href="/logo-mark.png" />
    <style>
      /* Shown until the app script takes over; mirrors .boot-screen in styles.css. */
      html {
        background: #131517;
      }
      .boot-screen {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 22px;
        background: #131517;
        color: #9f9f9f;
        font:
          14px Arial,
          Helvetica,
          sans-serif;
      }
      .boot-ring {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: #ededed;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="root">
      <div class="boot-screen">
        <img src="/logo-mark.png" alt="Level" width="120" height="40" />
        <div class="boot-ring"></div>
        <span>Loading your studio…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
