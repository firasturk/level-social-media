<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Level Social Media</title>
    <meta
      name="description"
      content="Social-media post studio for Level MENA clients: brand kits, themes, product and script posts, feed grids."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Tajawal:wght@400;500;700&family=Cairo:wght@400;700;900&family=Almarai:wght@400;700;800&family=Noto+Kufi+Arabic:wght@400;600;700;800&family=Gulzar&family=Noto+Nastaliq+Urdu:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Mirza:wght@400;700&family=Lateef:wght@400;700&family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;700&family=El+Messiri:wght@400;700&family=Lalezar&family=Rakkas&family=Lemonada:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;700&family=Readex+Pro:wght@400;700&family=Alexandria:wght@400;700&family=Changa:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Vazirmatn:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/level-white.svg" />
    <style>
      /* Shown until the app script takes over; mirrors .boot-screen in styles.css. */
      html {
        background: #131517;
      }
      .boot-screen {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 22px;
        background: #131517;
        color: #9f9f9f;
        font:
          14px Inter,
          Arial,
          sans-serif;
      }
      .boot-ring {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: #ededed;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="root">
      <div class="boot-screen">
        <img src="/level-white.svg" alt="Level" width="150" height="42" />
        <div class="boot-ring"></div>
        <span>Loading your studio…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
